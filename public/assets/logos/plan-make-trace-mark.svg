<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Plan Make Trace mark, colour-agnostic.

    Path data, node radii and the arrow are identical to
    plan-make-trace-badge-colour.svg. Three things differ:
      1. The badge tile (dark gradient rounded square) is gone; the tile is a
         CSS concern now (.pmt-logo-tile), not a baked-in asset.
      2. Every fill and stroke resolves to currentColor, so colour is set by
         the CSS `color` property on the SVG or any ancestor.
      3. The stroked paths carry no stroke-width of their own; they inherit
         --pmt-logo-stroke-width so line weight is a CSS dial too. The original
         weight was 38.4 (38.35 on the vertical, an immaterial difference).

    The viewBox is cropped from the original 0 0 1080 1080 down to a square
    centred on the mark's true bounds, plus ~6% padding on each side. The
    artwork is untouched; only the canvas around it changed.
-->
<svg width="100%" height="100%" viewBox="210.5 195 690 690" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;">
    <g id="PMT-Logo-mark">
        <circle id="node-right" cx="814.284" cy="555.262" r="43.2" style="fill:currentColor;stroke:currentColor;stroke-width:1px;"/>
        <path id="node-top" d="M339.272,277.903c-0,-23.812 -19.333,-43.144 -43.145,-43.144c-23.812,0 -43.144,19.332 -43.144,43.144c0,23.812 19.332,43.145 43.144,43.145c23.812,-0 43.145,-19.333 43.145,-43.145Z" style="fill:currentColor;"/>
        <path id="node-bottom" d="M339.272,802.236c-0,23.812 -19.333,43.144 -43.145,43.144c-23.812,0 -43.144,-19.332 -43.144,-43.144c0,-23.812 19.332,-43.144 43.144,-43.144c23.812,-0 43.145,19.332 43.145,43.144Z" style="fill:currentColor;"/>
        <path d="M296.127,277.903l0,524.333" style="fill:none;stroke:currentColor;stroke-linecap:butt;stroke-linejoin:bevel;"/>
        <path id="arrow" d="M457.609,845.171l-86.4,-43.2l86.4,-43.2l0,86.4Z" style="fill:currentColor;"/>
        <path d="M814.46,631.338l0,40.954c0,71.572 -58.107,129.679 -129.678,129.679l-244.453,-0" style="fill:none;stroke:currentColor;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:1;"/>
        <path d="M371.149,277.764l313.633,0c71.571,0 129.678,58.107 129.678,129.678c0,24.194 0,-3.815 0,71.551" style="fill:none;stroke:currentColor;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:1;"/>
    </g>
</svg>
